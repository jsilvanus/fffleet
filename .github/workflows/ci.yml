name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Start an S3 server (versitygw)
        run: |
          docker run -d --name s3 -p 7070:7070 versity/versitygw:latest --access fffleetkey --secret fffleetsecret posix /tmp
          for i in $(seq 1 30); do curl -s -o /dev/null localhost:7070 && break; sleep 1; done
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
        env:
          FFFLEET_TEST_S3_ENDPOINT: http://127.0.0.1:7070
      - name: End-to-end tests (orchestrator + two workers streaming)
        run: npm run test:e2e

  # Windows is supported for running workers and the orchestrator on a spare PC. This job reports
  # whether the tests pass there; it does not block merging while the support is new.
  windows:
    name: Tests (Windows)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: End-to-end tests
        run: npm run test:e2e

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        image: [worker, orchestrator]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: fffleet-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test the image
        run: |
          port=$([ "${{ matrix.image }}" = worker ] && echo 5100 || echo 5000)
          docker run -d --name smoke -p $port:$port -e FFFLEET_TOKEN=t fffleet-${{ matrix.image }}:ci
          for i in $(seq 1 30); do curl -fs localhost:$port/v1/health && break; sleep 1; done
          curl -fs -H 'authorization: Bearer t' localhost:$port/v1/capabilities | tee caps.json
          if [ "${{ matrix.image }}" = worker ]; then
            grep -q '"type:ffmpeg"' caps.json
            grep -q '"filter:ass"' caps.json
            grep -q '"encoder:libx264"' caps.json
          fi
          docker logs smoke
          docker rm -f smoke
