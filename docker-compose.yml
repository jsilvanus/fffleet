# An orchestrator and two workers. Clients use http://localhost:5000 with FFFLEET_TOKEN.
#   FFFLEET_TOKEN=... FFFLEET_WORKER_TOKEN=... docker compose up --build
# Workers share ./media at /media, so file:///media/... URIs work on every worker.
services:
  orchestrator:
    build: { context: ., dockerfile: docker/orchestrator.Dockerfile }
    image: ghcr.io/jsilvanus/fffleet-orchestrator:latest
    environment:
      FFFLEET_TOKEN: ${FFFLEET_TOKEN:?set FFFLEET_TOKEN}
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      # Per-app logins instead of (or beside) the shared FFFLEET_TOKEN; see the README, "Logins".
      # FFFLEET_CLIENTS_FILE: /data/clients.json
      # FFFLEET_SIGNING_KEY_FILE: /data/signing.pem
      # Keep queued and running jobs across restarts (see docs/operations.md):
      # FFFLEET_STATE_FILE: /data/state.db
    # volumes: ["./orchestrator-data:/data"]
    ports: ["5000:5000"]

  worker-1: &worker
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: ghcr.io/jsilvanus/fffleet-worker:latest
    environment: &worker-env
      FFFLEET_WORKER_ID: worker-1
      FFFLEET_ADVERTISE_URL: http://worker-1:5100
      FFFLEET_ORCHESTRATOR_URL: http://orchestrator:5000
      FFFLEET_WORKER_TOKEN: ${FFFLEET_WORKER_TOKEN:?set FFFLEET_WORKER_TOKEN}
      FFFLEET_SLOTS: default=2,stream=1
      FFFLEET_CAPABILITIES: mount:/media
      # For s3:// inputs and outputs (empty = disabled):
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      FFFLEET_S3_ENDPOINT: ${FFFLEET_S3_ENDPOINT:-}
      FFFLEET_S3_PATH_STYLE: ${FFFLEET_S3_PATH_STYLE:-}
    volumes: ["./media:/media"]
    depends_on: [orchestrator]

  worker-2:
    <<: *worker
    environment:
      <<: *worker-env
      FFFLEET_WORKER_ID: worker-2
      FFFLEET_ADVERTISE_URL: http://worker-2:5100
