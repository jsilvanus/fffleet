# Placement for the church stack. Worker IDs are set with FFFLEET_WORKER_ID on each worker;
# capabilities with FFFLEET_CAPABILITIES (see docs/worker-roles.md for the full plan).
#
#   pi            usb, normal         Pi 4: local USB capture hardware, light stream work next to MediaMTX
#   operator-pc   normal, dsk, gpu    Operator PC: Docker worker, the strong machine
#   assisting-pc  normal              Assisting PC: spare capacity
#
# No pools: the workers start themselves and register.
placement:
  # Hardware that only exists on the Pi (Hama USB capture, USB audio, ...). Jobs say requires: ["usb"].
  # No other worker has the capability, so this rule is a safety net as much as a preference.
  - match: { requires: ["usb"] }
    workers: [pi]
  # DSK / graphics rendering and anything that needs a GPU: operator PC first, assisting PC second. Never the Pi.
  - match: { type: dsk }
    workers: [operator-pc, assisting-pc]
  - match: { requires: ["gpu"] }
    workers: [operator-pc]
  # Relay / MediaMTX work ("normal"): stream jobs say requires: ["normal"]. Strong machines first, the Pi last.
  - match: { kind: stream, requires: ["normal"] }
    workers: [operator-pc, assisting-pc, pi]
  # Other stream jobs: same order.
  - match: { kind: stream }
    workers: [operator-pc, assisting-pc, pi]
  # Everything else: same order, and any other worker is allowed after them (least loaded).
  - workers: [operator-pc, assisting-pc, pi]
    others: true
